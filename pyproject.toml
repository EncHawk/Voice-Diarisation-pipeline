[project]
name = "diarization-beta"
version = "0.1.0"
description = "Local CPU Speaker Diarization & Identification Engine"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26",
    "onnxruntime>=1.18",
    "scikit-learn>=1.5",
    "soundfile>=0.12",
    "typer>=0.12",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "silero-vad>=6.2.1",
]

[project.optional-dependencies]
vad = ["silero-vad>=5.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "ruff>=0.6",
]
export = [
    "torch>=2.2",
    "torchaudio>=2.2",
    "speechbrain>=1.0",
]

[project.scripts]
diarize = "diarization_beta.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/diarization_beta"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "ruff>=0.6",
]
export = [
    "torch>=2.2",
    "torchaudio>=2.2",
    "speechbrain>=1.0",
]
